name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to freezino.online
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/freezino_python_api
            git fetch --all
            git reset --hard origin/main
            ./deploy.sh prod

      - name: Health check
        run: |
          echo "Waiting for services to stabilize..."
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://freezino.online/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health OK (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 5s"
            sleep 5
          done
          echo "::error ::Healthcheck failed after retries"
          exit 1
